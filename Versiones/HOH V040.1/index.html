<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HOH V039</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <aside id="sidebar" class="sidebar"><button class="collapse">☰</button>
            <h2>Control Hotspot</h2>
        </aside>
        <main class="main">
            <header class="topbar">
    <input id="searchBox"
           placeholder="🔍 Buscar SAP, ticket o sucursal"
           onkeyup="applyFilters()">
</header>

<div class="tabs">

    <button
        id="tabOperacion"
        class="tab active-tab"
        onclick="showOperacion()">

        📋 Operación

    </button>

    <button
        id="tabFolios"
        class="tab"
        onclick="showFolios()">

        📂 Control de Folios

    </button>

</div>

<div id="kpis" class="kpis"></div>
            <div class="workspace">

    <section id="feed" class="feed"></section>

    <section class="detail-center card-panel">

        <div id="detailContent">
            Seleccione un ticket
        </div>

    </section>

    <aside class="info-panel">

        <div id="infoPanel">

            <h3>Información</h3>

            <p>
                V040 en construcción
            </p>

        </div>

    </aside>

</div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
